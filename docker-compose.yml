services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-hackaton}
      POSTGRES_USER: ${DB_USER:-hackaton}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-hackaton}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
